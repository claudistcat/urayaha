name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: install
        run: pip install -e .

      - name: 整形されているか
        run: urayaha fmt --check .

      - name: 構文と型を調べる
        run: urayaha check examples

      - name: Python の単体テスト
        run: python -m unittest discover -s tests

      - name: URAYAHA 側のテスト
        run: urayaha test

      - name: パッケージが組み立てられるか
        run: |
          python -m pip install --quiet build twine
          python -m build --outdir build_dist
          python -m twine check build_dist/*

      - name: サンプルが走るか
        shell: bash
        run: |
          for f in examples/hello.ura examples/fizzbuzz.ura \
                   examples/fibonacci.ura examples/kitchen_sink.ura \
                   examples/file_io.ura examples/urayaha.ura; do
            echo "--- $f"
            urayaha run "$f" --quiet
          done

env:
  PYTHONIOENCODING: utf-8
